<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학생부 기록 정리</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header>
      <h1>학생부 기록 정리</h1>
      <p>조회형 엑셀을 학생별 표로 변환합니다.</p>
    </header>

    <form id="upload-form">
      <label class="drop-zone" id="drop-zone" for="file-input">
        <input id="file-input" name="file" type="file" accept=".xlsx" multiple required>
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M7 3.75h6.5L18 8.25v12H7zM13.5 3.75v4.5H18M10 12h5M10 15h5"/>
        </svg>
        <strong>엑셀 파일 선택</strong>
        <span>여러 파일을 한 번에 선택할 수 있습니다.</span>
      </label>

      <div id="file-summary" class="file-summary" hidden></div>
      <ul id="file-list" class="file-list"></ul>

      <button id="convert-button" type="submit" disabled>
        <span class="button-text">파일 정리하기</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <footer>파일당 최대 4MB · 결과는 각각 다운로드됩니다.</footer>
  </main>

  <script>
    const form = document.getElementById('upload-form');
    const input = document.getElementById('file-input');
    const zone = document.getElementById('drop-zone');
    const button = document.getElementById('convert-button');
    const buttonText = button.querySelector('.button-text');
    const fileSummary = document.getElementById('file-summary');
    const fileList = document.getElementById('file-list');
    const status = document.getElementById('status');
    let selectedFiles = [];

    function sizeLabel(bytes) {
      return bytes < 1024 * 1024
        ? `${Math.max(1, Math.round(bytes / 1024))}KB`
        : `${(bytes / 1024 / 1024).toFixed(1)}MB`;
    }

    function showStatus(type, message) {
      status.className = `status ${type}`;
      status.textContent = message;
    }

    function setFiles(fileCollection) {
      const files = Array.from(fileCollection);
      const invalid = files.find(file => !file.name.toLowerCase().endsWith('.xlsx'));
      const oversized = files.find(file => file.size > 4 * 1024 * 1024);

      if (invalid) {
        selectedFiles = [];
        renderFiles();
        showStatus('error', '.xlsx 파일만 선택할 수 있습니다.');
        return;
      }
      if (oversized) {
        selectedFiles = [];
        renderFiles();
        showStatus('error', '각 파일은 4MB 이하여야 합니다.');
        return;
      }

      selectedFiles = files;
      renderFiles();
      status.className = 'status';
      status.textContent = '';
    }

    function renderFiles() {
      fileList.replaceChildren();
      const hasFiles = selectedFiles.length > 0;
      fileSummary.hidden = !hasFiles;
      fileSummary.textContent = hasFiles ? `${selectedFiles.length}개 파일 선택됨` : '';

      for (const file of selectedFiles) {
        const item = document.createElement('li');
        const name = document.createElement('span');
        const size = document.createElement('small');
        name.textContent = file.name;
        size.textContent = sizeLabel(file.size);
        item.append(name, size);
        fileList.append(item);
      }

      button.disabled = !hasFiles;
      buttonText.textContent = hasFiles ? `${selectedFiles.length}개 파일 정리하기` : '파일 정리하기';
      zone.classList.toggle('has-files', hasFiles);
    }

    async function convertFile(file) {
      const body = new FormData();
      body.append('file', file);
      const response = await fetch('/convert', { method: 'POST', body });
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(payload.error || '파일을 처리하지 못했습니다.');
      }

      const blob = await response.blob();
      const downloadName = decodeURIComponent(
        response.headers.get('X-Download-Name') || `${file.name.replace(/\.xlsx$/i, '')}_정리.xlsx`
      );
      const downloadUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = downloadUrl;
      link.download = downloadName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(downloadUrl), 2000);
    }

    input.addEventListener('change', () => setFiles(input.files));
    ['dragenter', 'dragover'].forEach(name => zone.addEventListener(name, event => {
      event.preventDefault();
      zone.classList.add('dragging');
    }));
    ['dragleave', 'drop'].forEach(name => zone.addEventListener(name, event => {
      event.preventDefault();
      zone.classList.remove('dragging');
    }));
    zone.addEventListener('drop', event => setFiles(event.dataTransfer.files));

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!selectedFiles.length) return;

      button.disabled = true;
      button.classList.add('loading');
      const failures = [];

      for (let index = 0; index < selectedFiles.length; index += 1) {
        const file = selectedFiles[index];
        showStatus('working', `${index + 1}/${selectedFiles.length} 처리 중 · ${file.name}`);
        try {
          await convertFile(file);
        } catch (error) {
          failures.push(`${file.name}: ${error.message}`);
        }
      }

      button.classList.remove('loading');
      button.disabled = false;
      if (failures.length) {
        showStatus('error', `${selectedFiles.length - failures.length}개 완료 · ${failures.length}개 실패`);
      } else {
        showStatus('success', `${selectedFiles.length}개 파일을 모두 정리했습니다.`);
      }
    });
  </script>
</body>
</html>
